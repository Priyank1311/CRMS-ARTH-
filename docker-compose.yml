services:
  db:
    image: postgres:16-alpine
    container_name: cmrs_postgres
    restart: always
    environment:
      POSTGRES_DB: cmrs_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: "./CRMS Backend"
    container_name: cmrs_backend
    restart: always
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_data &&
             python manage.py runserver 0.0.0.0:8000"
    environment:
      - SECRET_KEY=django-insecure-docker-secret-key-fintech-cmrs
      - DEBUG=True
      - DB_ENGINE=postgresql
      - DB_NAME=cmrs_db
      - DB_USER=postgres
      - DB_PASSWORD=postgrespassword
      - DB_HOST=db
      - DB_PORT=5432
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    image: node:22-alpine
    container_name: cmrs_frontend
    working_dir: /app
    volumes:
      - "./CRMS Frontend:/app"
    ports:
      - "5173:5173"
    command: sh -c "npm install && npx vite --host 0.0.0.0 --port 5173"
    depends_on:
      - backend

volumes:
  postgres_data:
