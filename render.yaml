databases:
  - name: crms-database
    plan: free
    databaseName: cmrs_db
    user: cmrs_user

services:
  - type: web
    plan: free
    name: crms-backend
    runtime: python
    rootDir: "CRMS Backend"
    buildCommand: "./build.sh"
    startCommand: "python manage.py migrate --no-input && python manage.py seed_data && gunicorn cmrs_project.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: crms-database
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"
